
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>LIFF Flex Message - Excel Batch Generator (V3 - Redesign Final)</title>
    <style>
        :root {
            --primary: #06C755;
            --bg-color: #f4f6f8;
            --panel-bg: #ffffff;
            --border: #e1e4e8;
            --primary-red: #D31145;
            --primary-red-hover: #E52A5A;
            --text-main: #111111;
            --text-sub: #555555;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
        }

        .header {
            background: var(--panel-bg);
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h2 { margin: 0; color: #333; }
        
        .upload-section {
            display: flex; align-items: center; gap: 15px;
        }

        .upload-section input[type="file"] {
            font-size: 14px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; background: #fff;
        }

        .btn {
            background: var(--primary); color: white; border: none; padding: 10px 20px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s;
        }
        .btn:hover { background: #05a044; }
        .btn-zip { background: #D31145; }
        .btn-zip:hover { background: #a80e37; }

        /* Grid for Previews */
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 24px;
        }

        .preview-item {
            background: var(--panel-bg); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            overflow: hidden; display: flex; flex-direction: column;
        }

        .preview-header {
            background: #2d2d2d; color: white; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .preview-header h3 { margin: 0; font-size: 16px; }

        .preview-box {
            background-color: #eaeef1; position: relative; height: 600px;
            overflow-y: auto; padding: 20px; display: flex; flex-direction: column;
        }

        .carousel-preview {
            display: flex; gap: 12px; width: 100%; overflow-x: auto;
            padding-bottom: 20px; scrollbar-width: none; align-items: flex-start;
        }
        .carousel-preview::-webkit-scrollbar { display: none; }

        /* New Card Design Styles */
        .single-card { 
            background: #ffffff; border-radius: 20px; width: 300px; flex-shrink: 0;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1); position: relative; overflow: hidden; 
            display: flex; flex-direction: column;
        }
        .hero-img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; }
        .agent-card-body { padding: 20px 20px 10px; display: flex; flex-direction: column; position: relative; }
        
        .profile-section { display: flex; flex-direction: row; align-items: flex-start; gap: 14px; margin-bottom: 20px; width: 100%; position: relative; }
        .avatar-container { width: 60px; height: 60px; border-radius: 50%; overflow: hidden; flex-shrink: 0; border: 1px solid #eee; margin-top: 2px; }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; }
        .profile-info { display: flex; flex-direction: column; flex-grow: 1; text-align: left; overflow: hidden; }
        .title-text { font-weight: 800; font-size: 15px; color: var(--text-main); margin-bottom: 4px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta-row { display: flex; flex-direction: column; margin-bottom: 2px; }
        .meta-row .label { font-size: 10px; color: #888; font-weight: 600; line-height: 1; margin-bottom: 2px; }
        .meta-row .value { font-size: 12px; color: var(--text-sub); font-weight: 500; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta-divider { height: 1px; background-color: #f0f0f0; margin: 6px 0; width: 100%; }

        .customer-message-box { background-color: #fff4f6; border: 1px solid #ffe1e8; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
        .msg-text { font-size: 13px; color: #222; line-height: 1.4; }

        .footer { padding: 10px 20px 24px; }
        .btn-primary { background: linear-gradient(135deg, var(--primary-red), var(--primary-red-hover)); box-shadow: 0 4px 15px rgba(211, 17, 69, 0.35); color: white; text-align: center; padding: 12px; border-radius: 999px; font-weight: bold; display: block; font-size: 14px; border: none; width: 100%; text-decoration: none;}

        .bubble-image-only { padding: 0; }
        .bubble-full-img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; }
        
        .main-fab-container-preview { position: sticky; bottom: 0px; left: 0; width: 100%; padding: 16px 0; display: flex; flex-direction: column; gap: 10px; align-items: center; z-index: 10; margin-top: auto; }
        .btn-share-main-preview { background: #06C755; color: white; border: none; border-radius: 999px; padding: 14px 16px; font-size: 15px; font-weight: bold; box-shadow: 0 4px 15px rgba(211, 17, 69, 0.3); width: 280px; text-align: center; }

        .empty-state { text-align: center; padding: 60px 20px; color: #777; grid-column: 1 / -1; background: #fff; border-radius: 12px; border: 2px dashed #ccc; }
        
        .badge { background: #eee; font-size: 11px; padding: 3px 6px; border-radius: 4px; margin-top: 4px; display: inline-block; color: #555; }
        .badge.active { background: #e2fbe8; color: #06C755; }
    </style>
    <!-- Include SheetJS & FileSaver & JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>

    <div class="header">
        <h2>Batch HTML Generator (Redesign V3 Final)</h2>
        <div class="upload-section">
            <input type="file" id="excelFile" accept=".xlsx, .xls">
            <button class="btn btn-zip" id="downloadAllBtn" style="display:none;" onclick="downloadAll()">Download All (ZIP)</button>
        </div>
    </div>

    <div class="preview-grid" id="previewGrid">
        <div class="empty-state">
            <h3>No Data Loaded</h3>
            <p>Please upload the Excel template to view previews and generate HTML files.<br>Supports new columns: <b>Copy URL</b> and <b>AIO URL</b></p>
        </div>
    </div>

    <script>
        window.generatedData = [];

        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = evt.target.result;
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const rows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                
                processExcelData(rows);
            };
            reader.readAsArrayBuffer(file);
        });

        function getColValue(row, possibleNames) {
            for (const key of Object.keys(row)) {
                if (possibleNames.some(name => key.toLowerCase().includes(name.toLowerCase()))) {
                    return String(row[key] || '').trim();
                }
            }
            return '';
        }

        function processExcelData(rows) {
            window.generatedData = [];
            const grid = document.getElementById('previewGrid');
            grid.innerHTML = '';
            
            rows.forEach((row, index) => {
                const modeStr = String(row['Select layout mode'] || '').toLowerCase();
                const mode = modeStr.includes('2') ? '2' : '1';

                const copyUrl = getColValue(row, ['copy url', 'copy link']);
                const aioUrl = getColValue(row, ['aio url', 'aio link']);
                const mainBtnLabel = row['Button 1 Label'] || 'แชร์ให้ลูกค้า';

                const config = {
                    id: row['Content'] || (index + 1),
                    mode: mode,
                    liffId: String(row['Liff ID'] || '').trim(),
                    
                    mainBtnLabel: mainBtnLabel,
                    copyUrl: copyUrl,
                    aioUrl: aioUrl,
                    
                    heroImage: row['Hero Image URL'] || 'https://www.aia.co.th/content/dam/th-wise/images/th/img/content216-9.jpg',
                    title: row['Title name'] || 'Agent Name',
                    desc: row['Description text'] || 'สิทธิพิเศษนี้เฉพาะคุณเท่านั้น สนใจทักแชทกลับได้เลย',
                    btnLabel: row['Button label'] || 'ดูข้อมูลเพิ่มเติม',
                    btnLink: row['Button target URL'] || '#',
                    
                    card2Image: row['Card 2 URL'] || 'https://via.placeholder.com/600x800?text=Card+2'
                };
                
                window.generatedData.push(config);
                renderPreview(config, grid);
            });

            if (window.generatedData.length > 0) {
                document.getElementById('downloadAllBtn').style.display = 'inline-block';
            }
        }

        function renderPreview(cfg, container) {
            const div = document.createElement('div');
            div.className = 'preview-item';
            
            let card2HTML = '';
            if (cfg.mode === '2') {
                card2HTML = `
                <div class="single-card" style="margin-left: 12px;">
                    <div class="bubble-image-only">
                        <img src="${cfg.card2Image}" class="bubble-full-img" alt="Card 2">
                    </div>
                </div>`;
            }
            
            const justify = cfg.mode === '1' ? 'center' : 'flex-start';
            
            const aioBadge = cfg.aioUrl ? '<div class="badge active">AIO Link: Enabled</div>' : '<div class="badge">AIO Link: Disabled</div>';
            const copyBadge = cfg.copyUrl ? '<div class="badge active">Copy URL: Custom</div>' : '<div class="badge">Copy URL: Uses Btn URL</div>';

            div.innerHTML = `
                <div class="preview-header">
                    <h3>Content ${cfg.id}</h3>
                    <button class="btn" onclick="downloadSingle('${cfg.id}')">Download</button>
                </div>
                <div style="padding: 10px 20px; background:#fff; border-bottom:1px solid #eee; display:flex; gap:10px;">
                    ${aioBadge} ${copyBadge}
                </div>
                <div class="preview-box">
                    <div class="carousel-preview" style="justify-content: ${justify};">
                        
                        <!-- New Single Card Design -->
                        <div class="single-card">
                            <img src="${cfg.heroImage}" class="hero-img" alt="Hero">
                            <div class="agent-card-body">
                                <div class="profile-section">
                                    <div class="avatar-container">
                                        <img src="https://cdn-icons-png.flaticon.com/512/2037/2037844.png" class="avatar-img">
                                    </div>
                                    <div class="profile-info">
                                        <div class="title-text">${cfg.title}</div>
                                        <div class="meta-row">
                                            <div class="label">ใบอนุญาตตัวแทน</div>
                                            <div class="value">-</div>
                                        </div>
                                        <div class="meta-divider"></div>
                                        <div class="meta-row">
                                            <div class="value" style="color: #444;">ใจเย็น รับฟังทุกรายละเอียด</div>
                                        </div>
                                    </div>
                                </div>
                                <div class="customer-message-box">
                                    <div class="msg-text">${cfg.desc}</div>
                                </div>
                            </div>
                            <div class="footer">
                                <div class="btn-primary">${cfg.btnLabel}</div>
                            </div>
                        </div>
                        
                        ${card2HTML}
                    </div>
                    
                    <div class="main-fab-container-preview">
                        <div class="btn-share-main-preview">${cfg.mainBtnLabel}</div>
                    </div>
                </div>
            `;
            container.appendChild(div);
        }

        function generateHTMLCode(cfg) {
            let flexBubble1JSON = `
                    {

                            "type": "image",

                        },

                                                { "type": "image", "url": profile.pictureUrl || "https://cdn-icons-png.flaticon.com/512/2037/2037844.png", "size": "full", "aspectMode": "cover" }
                                            ]
                                        },
                                        {
                                            "type": "box",
                                            "layout": "vertical",
                                            "flex": 1,
                                            "contents": [
                                                { "type": "text", "text": dName, "weight": "bold", "color": "#111111", "size": "md", "wrap": true, "margin": "none" },
                                                {
                                                    "type": "box",
                                                    "layout": "vertical",
                                                    "spacing": "xs",
                                                    "margin": "sm",
                                                    "contents": [
                                                        { "type": "text", "text": "ใบอนุญาตตัวแทน", "size": "xxs", "color": "#888888", "weight": "bold" },
                                                        { "type": "text", "text": p1, "size": "xs", "color": "#555555", "wrap": true }
                                                    ]
                                                },
                                                { "type": "separator", "margin": "sm", "color": "#eeeeee" },
                                                { "type": "text", "text": p2, "size": "xs", "color": "#555555", "wrap": true, "margin": "sm" }
                                            ]
                                        }
                                    ]
                                },
                                {
                                    "type": "box",
                                    "layout": "vertical",
                                    "margin": "lg",
                                    "backgroundColor": "#fff4f6",
                                    "cornerRadius": "md",
                                    "paddingAll": "16px",
                                    "contents": [
                                        { "type": "text", "text": msg, "size": "sm", "color": "#222222", "wrap": true }
                                    ]
                                }
                            ]
                        },
                        "footer": {
                            "type": "box",
                            "layout": "vertical",
                            "paddingAll": "20px",
                            "paddingTop": "0px",
                            "contents": [
                                {
                                    "type": "button",
                                    "style": "primary",
                                    "color": "#D31145",
                                    "height": "sm",
                                    "action": { "type": "uri", "label": "${cfg.btnLabel}", "uri": targetUrl }
                                }
                            ]
                        }
                    }`;

            let flexPayloadJSON = "";
            let htmlCard2 = "";
            
            if (cfg.mode === '2') {
                flexPayloadJSON = `{
            "type": "carousel",
            "contents": [
                ${flexBubble1JSON},
                {
                    "type": "bubble",
                    "body": {
                        "type": "box",
                        "layout": "vertical",
                        "contents": [
                            {
                                "type": "image",
                                "url": "${cfg.card2Image}",
                                "size": "full",
                                "aspectMode": "cover",
                                "aspectRatio": "3:4",
                                "gravity": "top"
                            }
                        ],
                        "paddingAll": "0px"
                    }
                }
            ]
        }`;

                htmlCard2 = `
    <!-- Card 2 -->
    <div class="single-card" style="margin-left:12px;">
        <div class="bubble-image-only">
            <img src="${cfg.card2Image}" class="bubble-full-img" alt="Card 2">
        </div>
    </div>`;
            } else {
                flexPayloadJSON = flexBubble1JSON;
            }
            
            let aioMenuHTML = '';
            if (cfg.aioUrl && cfg.aioUrl !== '') {
                aioMenuHTML = `
    <a href="${cfg.aioUrl}" target="_blank" class="menu-item" onclick="toggleBottomSheet(false);">
        <div class="menu-icon list-icon-bg">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <div class="menu-text">
            <div class="menu-header">ตรวจสอบรายชื่อลูกค้าบน AIA One</div>
            <div class="menu-subheader">ที่เข้าเงื่อนไขแคมเปญ</div>
        </div>
        <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </a>`;
            }

            return `<!DOCTYPE html>

.menu-badge { background: #e2fbe8; color: #06C755; font-size: 10px; font-weight: bold; padding: 3px 6px; border-radius: 6px; margin-left: 8px; }
.chevron-icon { width: 20px; height: 20px; color: #ccc; flex-shrink: 0; margin-left: 8px; }

.modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center; backdrop-filter: blur(2px); }
.modal-content { background-color: #fff; padding: 20px; border-radius: 16px; width: 90%; max-width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
.modal-header { font-size: 18px; font-weight: bold; margin-bottom: 16px; text-align: center; color: #111; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; margin-bottom: 6px; font-weight: bold; color: #555; }
.form-group input[type="text"], .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; font-family: inherit; background: #fff; }
.form-group textarea { resize: none; height: 80px; }
.warning-box { background-color: #fff0f4; border: 1px solid #fbd0db; border-radius: 8px; padding: 10px; margin-top: 8px; margin-bottom: 4px; text-align: center; font-size: 11.5px; color: var(--primary-red); line-height: 1.4; }
.modal-actions { display: flex; gap: 12px; margin-top: 16px; }
.btn-cancel { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #eee; color: #555; cursor: pointer; font-weight: bold; font-size: 14px; }
.btn-save { flex: 1; padding: 12px; border: none; border-radius: 8px; background: var(--primary-red); color: white; cursor: pointer; font-weight: bold; font-size: 14px; }
.bubble-image-only { padding: 0; }
.bubble-full-img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; }
</style>
</head>
<body>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"><\/script>

<div class="main-fab-container">
    <button class="btn-share-main" onclick="toggleBottomSheet(true)">${cfg.mainBtnLabel}</button>
</div>

<div class="sheet-overlay" id="sheet-overlay" onclick="toggleBottomSheet(false)"></div>

<div class="bottom-sheet" id="bottom-sheet">
    <div class="sheet-drag-handle"></div>
    
    <a href="#" class="menu-item" onclick="shareFlex(); toggleBottomSheet(false); return false;">
        <div class="menu-icon line-icon-bg"><img src="https://upload.wikimedia.org/wikipedia/commons/4/41/LINE_logo.svg" alt="LINE"></div>
        <div class="menu-text">
            <div class="menu-header">ส่งผ่าน LINE <span class="menu-badge">แนะนำ</span></div>
            <div class="menu-subheader">เลือกเพื่อนหรือกลุ่ม</div>
        </div>
        <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </a>
    
    <a href="#" class="menu-item" onclick="copyShareLink(); return false;">
        <div class="menu-icon copy-icon-bg">
            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        </div>
        <div class="menu-text">
            <div class="menu-header">คัดลอกลิงก์</div>
            <div class="menu-subheader">นำไปวางใน SMS, Facebook, Email หรือช่องทางอื่นๆ</div>
        </div>
        <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </a>
    ${aioMenuHTML}
</div>

<div class="preview-container">
    <div class="single-card">
        <a href="${cfg.btnLink}" target="_blank">
            <img src="${cfg.heroImage}" class="hero-img" alt="Hero">
        </a>
        <div class="agent-card-body">
            <div class="profile-section">
                <div class="avatar-container">
                    <img id="preview-avatar" src="https://cdn-icons-png.flaticon.com/512/2037/2037844.png" class="avatar-img" alt="Avatar">
                </div>
                <div class="profile-info">
                    <div class="title-text" id="preview-display-name">${cfg.title}</div>
                    <div class="meta-row">
                        <div class="label">ใบอนุญาตตัวแทน</div>
                        <div class="value" id="preview-profile1">-</div>
                    </div>
                    <div class="meta-divider"></div>
                    <div class="meta-row">
                        <div class="value" id="preview-profile2" style="color: #444;">ใจเย็น รับฟังทุกรายละเอียด</div>
                    </div>
                </div>
                <button class="edit-btn-minimal profile-edit-btn" onclick="openProfileModal()" title="แก้ไขโปรไฟล์">
                    <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
                    <span class="edit-btn-text">แก้ไข</span>
                </button>
            </div>
            
            <div class="customer-message-box">
                <div class="msg-text" id="preview-message">${cfg.desc}</div>
                <button class="edit-btn-minimal msg-edit-btn" onclick="openMessageModal()" title="แก้ไขข้อความ">
                    <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
                    <span class="edit-btn-text">แก้ไข</span>
                </button>
            </div>
        </div>
        <div class="footer">
            <a href="${cfg.btnLink}" target="_blank" class="btn-primary">${cfg.btnLabel}</a>
        </div>
    </div>${htmlCard2}
</div>

<div id="editProfileModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">แก้ไขโปรไฟล์ตัวแทน</div>
        <div class="form-group">
            <label>ชื่อที่ต้องการแสดง</label>
            <input type="text" id="input-display-name" maxlength="15" placeholder="เช่น โค้ชสมชาย AIA">
        </div>
        <div class="form-group">
            <label>เลขที่ใบอนุญาตตัวแทน (10 หลัก)</label>
            <input type="text" id="input-profile1" placeholder="ระบุตัวเลข 10 หลัก" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'');">
        </div>
        <div class="form-group">
            <label>สไตล์การขาย</label>
            <select id="input-profile2">
                <option value="ใจเย็น รับฟังทุกรายละเอียด">ใจเย็น รับฟังทุกรายละเอียด</option>
                <option value="คุยง่าย ไม่กดดัน">คุยง่าย ไม่กดดัน</option>
                <option value="ใส่ใจในรายละเอียด">ใส่ใจในรายละเอียด</option>
                <option value="ดูแลลูกค้าอย่างต่อเนื่อง">ดูแลลูกค้าอย่างต่อเนื่อง</option>
				<option value="ให้คำแนะนำอย่างตรงไปตรงมา">ให้คำแนะนำอย่างตรงไปตรงมา</option>
				<option value="เน้นบริการหลังการขาย">เน้นบริการหลังการขาย</option>
            </select>
        </div>
        <div class="warning-box">ข้อมูลนี้จะแสดงบนโปรไฟล์ตัวแทน<br>ตรวจสอบความถูกต้องก่อนบันทึก</div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeProfileModal()">ยกเลิก</button>
            <button class="btn-save" onclick="saveProfileInfo()">บันทึกข้อมูล</button>
        </div>
    </div>
</div>

<div id="editMessageModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">แก้ไขข้อความถึงลูกค้า</div>
        <div class="form-group">
            <label>สูงสุด 100 ตัวอักษร</label>
            <textarea id="input-message" maxlength="100" placeholder="พิมพ์ข้อความเชิญชวน..."></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeMessageModal()">ยกเลิก</button>
            <button class="btn-save" onclick="saveMessageInfo()">บันทึกข้อความ</button>
        </div>
    </div>
</div>

<script>
const LIFF_ID = "${cfg.liffId}";
let userProfile = null;

async function init() {
    loadAgentInfo();
    try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isInClient()) { console.log("Not inside LINE app"); return; }
        if (!liff.isLoggedIn()) { 
            liff.login(); 
        } else {
            userProfile = await liff.getProfile();
            document.getElementById('preview-avatar').src = userProfile.pictureUrl || "https://cdn-icons-png.flaticon.com/512/2037/2037844.png";
        }
    } catch(err) { console.error(err); }
}

function loadAgentInfo() {
    const dName = localStorage.getItem('agentDisplayName') || "${cfg.title}";
    const p1 = localStorage.getItem('agentProfile1') || 'ระบุเลขที่ใบอนุญาต';
    const p2 = localStorage.getItem('agentProfile2') || 'ใจเย็น รับฟังทุกรายละเอียด';
    const msg = localStorage.getItem('agentMessage') || "${cfg.desc}";

    document.getElementById('preview-display-name').innerText = dName;
    document.getElementById('preview-profile1').innerText = p1;
    document.getElementById('preview-profile2').innerText = p2;
    document.getElementById('preview-message').innerText = msg;
}

function openProfileModal() {
    document.getElementById('input-display-name').value = localStorage.getItem('agentDisplayName') || "${cfg.title}";
    document.getElementById('input-profile1').value = localStorage.getItem('agentProfile1') || '';
    document.getElementById('input-profile2').value = localStorage.getItem('agentProfile2') || 'ใจเย็น รับฟังทุกรายละเอียด';
    document.getElementById('editProfileModal').style.display = "flex";
}
function closeProfileModal() { document.getElementById('editProfileModal').style.display = "none"; }
function saveProfileInfo() {
    const p1Input = document.getElementById('input-profile1').value;
    if (p1Input.length > 0 && p1Input.length !== 10) { alert("กรุณากรอกเลขที่ใบอนุญาตตัวแทนให้ครบ 10 หลัก"); return; }
    localStorage.setItem('agentDisplayName', document.getElementById('input-display-name').value);
    localStorage.setItem('agentProfile1', p1Input);
    localStorage.setItem('agentProfile2', document.getElementById('input-profile2').value);
    loadAgentInfo(); closeProfileModal();
}

function openMessageModal() {
    document.getElementById('input-message').value = localStorage.getItem('agentMessage') || "${cfg.desc}";
    document.getElementById('editMessageModal').style.display = "flex";
}
function closeMessageModal() { document.getElementById('editMessageModal').style.display = "none"; }
function saveMessageInfo() {
    localStorage.setItem('agentMessage', document.getElementById('input-message').value);
    loadAgentInfo(); closeMessageModal();
}

function toggleBottomSheet(show) {
    const sheet = document.getElementById('bottom-sheet');
    const overlay = document.getElementById('sheet-overlay');
    if (show) {
        sheet.classList.add('active'); overlay.classList.add('active');
        document.querySelector('.main-fab-container').style.display = 'none';
    } else {
        sheet.classList.remove('active'); overlay.classList.remove('active');
        setTimeout(() => { document.querySelector('.main-fab-container').style.display = 'block'; }, 250);
    }
}

function copyShareLink() {
    let shareUrl = "${cfg.copyUrl}";
    if(!shareUrl || shareUrl.trim() === "") { shareUrl = "${cfg.btnLink}"; }
    
    const textArea = document.createElement("textarea");
    textArea.value = shareUrl;
    textArea.style.position = "fixed"; textArea.style.left = "-999999px"; textArea.style.top = "-999999px";
    document.body.appendChild(textArea); textArea.focus(); textArea.select();
    
    try { document.execCommand('copy'); alert("คัดลอกลิงก์สำเร็จ!"); toggleBottomSheet(false); }
    catch (err) { alert("ไม่สามารถคัดลอกลิงก์ได้ กรุณาลองใหม่อีกครั้ง"); }
    textArea.remove();
}

function getQueryParams() {
    const params = new URLSearchParams(window.location.search);
    if (params.has('referral')) { return \`referral=\${params.get('referral')}\`; }
    const liffState = params.get('liff.state');
    if (liffState) {
        const decodedState = decodeURIComponent(liffState);
        const innerParams = new URLSearchParams(decodedState);
        const referral = innerParams.get('referral');
        if (referral) { return \`referral=\${referral}\`; }
    }
    return "";
}

async function shareFlex() {
    try {
        const query = getQueryParams();
        let targetUrl = "${cfg.btnLink}";
        if(query) { targetUrl += (targetUrl.includes('?') ? '&' : '?') + query; }

        const profile = userProfile || await liff.getProfile();
        const dName = localStorage.getItem('agentDisplayName') || "${cfg.title}";
        const p1 = localStorage.getItem('agentProfile1') || 'ระบุเลขที่ใบอนุญาต';
        const p2 = localStorage.getItem('agentProfile2') || 'ใจเย็น รับฟังทุกรายละเอียด';
        const msg = localStorage.getItem('agentMessage') || "${cfg.desc}";

        const flexMessage = {
            "type": "flex",
            "altText": "ข้อความถึงคุณจากตัวแทน",
            "contents": ${flexPayloadJSON}
        };

        if (liff.isApiAvailable('shareTargetPicker')) {
            await liff.shareTargetPicker([flexMessage]);
        } else {
            alert("ShareTargetPicker is not supported on this LINE version.");
        }
    } catch(err) {
        console.error(err);
        alert("Share failed: " + err.message);
    }
}
init();
<\/script>
</body>
</html>`;
        }

        function downloadSingle(id) {
            const cfg = window.generatedData.find(c => String(c.id) === String(id));
            if (!cfg) return;
            const html = generateHTMLCode(cfg);
            const blob = new Blob([html], { type: "text/html;charset=utf-8" });
            saveAs(blob, `Content_${id}.html`);
        }

        function downloadAll() {
            const zip = new JSZip();
            window.generatedData.forEach(cfg => {
                const html = generateHTMLCode(cfg);
                zip.file(`Content_${cfg.id}.html`, html);
            });
            zip.generateAsync({type:"blob"}).then(function(content) {
                saveAs(content, "All_LIFF_Campaigns.zip");
            });
        }
    </script>
</body>
</html>
